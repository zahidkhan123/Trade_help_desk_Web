<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Trade Help Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --primary: #FF9933; --primary-dark: #e67e00; --primary-light: #fff4e6; --gray-50: #fafafa; --gray-100: #f4f4f5; --gray-200: #e4e4e7; --gray-600: #52525b; --gray-900: #18181b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--gray-900); background: var(--gray-50); }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }
    nav { background: white; border-bottom: 1px solid var(--gray-100); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; max-width: 1120px; margin: 0 auto; padding: 0 24px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
    .btn { display: inline-flex; padding: 12px 22px; border-radius: 12px; font-weight: 600; background: var(--primary); color: white; border: none; cursor: pointer; }
    .btn:hover { background: var(--primary-dark); }
    .page { padding: 80px 0; }
    h1 { font-size: 2.75rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; margin-top: 48px; }
    form { background: white; padding: 36px; border-radius: 20px; box-shadow: 0 10px 40px -12px rgba(0,0,0,0.08); border: 1px solid var(--gray-100); }
    label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 12px 16px; border: 1px solid var(--gray-200); border-radius: 12px; font-family: inherit; margin-bottom: 20px; font-size: 0.95rem; }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .info { padding: 12px 0; }
    .info div { margin-bottom: 28px; }
    .info strong { display: block; margin-bottom: 4px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 40 40" width="32" height="32"><circle cx="20" cy="20" r="18" fill="#FF9933"/><path d="M12 18c2-4 6-6 10-4s6 6 4 10" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M28 22c-2 4-6 6-10 4s-6-6-4-10" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="20" cy="14" r="2.5" fill="white"/></svg>
        Trade Help Desk
      </a>
      <a href="index.html" style="font-weight:500;color:var(--gray-600);">← Back to Home</a>
    </div>
  </nav>

  <div class="page">
    <div class="container">
      <h1>Get in touch</h1>
      <p style="color:var(--gray-600);font-size:1.15rem;max-width:480px;">Have a question or want a demo? We usually reply within one business day.</p>

      <div class="grid">
        <form>
          <label>Name</label>
          <input type="text" placeholder="Your name" required />
          <label>Email</label>
          <input type="email" placeholder="you@company.com" required />
          <label>Company</label>
          <input type="text" placeholder="Company name" />
          <label>Message</label>
          <textarea rows="5" placeholder="How can we help?" required></textarea>
          <button class="btn" type="submit">Send Message</button>
        </form>
        <div class="info">
          <div>
            <strong>Email</strong>
            <p style="color:var(--gray-600);">hello@tradehelpdesk.com</p>
          </div>
          <div>
            <strong>Support</strong>
            <p style="color:var(--gray-600);">support@tradehelpdesk.com</p>
          </div>
          <div>
            <strong>Response time</strong>
            <p style="color:var(--gray-600);">We usually reply within one business day.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
