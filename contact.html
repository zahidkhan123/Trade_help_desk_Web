<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Trade Help Desk</title>
  <meta name="description" content="Get in touch with Trade Help Desk. Request a demo or ask about our property maintenance and field service management platform." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" type="image/png" sizes="32x32" href="z3yGp.png">
  <link rel="icon" type="image/png" sizes="16x16" href="yK8Gq.png">
  <link rel="apple-touch-icon" sizes="180x180" href="PKVbD.png">
  <link rel="canonical" href="https://zahidkhan123.github.io/Trade_help_desk_Web/contact.html" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --primary: #FF9933; --primary-dark: #e67e00; --primary-soft: rgba(255,153,51,0.12); --ink: #0f0f0f; --muted: #6b6b6b; --border: #efefef; --bg: #ffffff; --bg-soft: #fafafa; --card: #ffffff; --nav-bg: rgba(255,255,255,0.9); }
    html.dark { --ink: #f5f5f5; --muted: #a0a0a0; --border: #2a2a2a; --bg: #0f0f0f; --bg-soft: #1a1a1a; --card: #1a1a1a; --nav-bg: rgba(15,15,15,0.9); --primary-soft: rgba(255,153,51,0.18); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: var(--bg-soft); -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 28px; }
    nav { background: var(--nav-bg); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 72px; max-width: 1120px; margin: 0 auto; padding: 0 28px; }
    .logo { display: flex; align-items: center; gap: 10px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1.2rem; }
    .logo img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 0.92rem; transition: all 0.2s; }
    .btn-outline { border: 1px solid var(--border); background: var(--card); color: var(--ink); }
    .btn-outline:hover { background: var(--bg-soft); }
    .btn-primary { background: var(--primary); color: white; border: none; cursor: pointer; padding: 13px 24px; box-shadow: 0 4px 14px rgba(255,153,51,0.3); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .theme-btn { background: none; border: 1px solid var(--border); border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; color: var(--ink); }
    .theme-btn:hover { background: var(--bg-soft); }
    .page { padding: 80px 0 120px; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 3rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; margin-top: 56px; }
    form { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 8px 30px -8px rgba(0,0,0,0.06); }
    label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 13px 16px; border: 1px solid var(--border); border-radius: 12px; font-family: inherit; margin-bottom: 18px; font-size: 0.96rem; transition: border-color 0.2s; background: var(--bg); color: var(--ink); }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,153,51,0.1); }
    .info div { margin-bottom: 32px; }
    .info strong { display: block; margin-bottom: 6px; font-size: 0.92rem; }
    @media (max-width: 800px) {
      .container { padding: 0 20px; }
      .grid { grid-template-columns: 1fr; gap: 40px; }
      h1 { font-size: 2.2rem; }
      form { padding: 28px 20px; }
      .page { padding: 60px 0 80px; }
      .nav-inner { padding: 0 20px; }
      .logo span { font-size: 1.05rem; }
    }
    @media (max-width: 480px) {
      .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <img src="PKVbD.png" alt="Trade Help Desk Logo">
        <span>Trade Help Desk</span>
      </a>
      <div style="display:flex;gap:12px;align-items:center;">
        <button class="theme-btn" id="theme-toggle" aria-label="Toggle dark mode"><span id="theme-icon">🌙</span></button>
        <a href="index.html" class="btn btn-outline">← Back</a>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="container">
      <h1>Get in touch</h1>
      <p style="color:var(--muted);font-size:1.1rem;">We usually reply within one business day.</p>

      <div class="grid">
        <form>
          <label>Name</label>
          <input type="text" placeholder="Your name" required />
          <label>Email</label>
          <input type="email" placeholder="you@company.com" required />
          <label>Company</label>
          <input type="text" placeholder="Company name" />
          <label>Message</label>
          <textarea rows="5" placeholder="How can we help?" required></textarea>
          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
        <div class="info">
          <div>
            <strong>Email</strong>
            <p style="color:var(--muted);">hello@tradehelpdesk.com</p>
          </div>
          <div>
            <strong>Support</strong>
            <p style="color:var(--muted);">support@tradehelpdesk.com</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      const html = document.documentElement;
      const toggle = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      function setTheme(dark) {
        if (dark) { html.classList.add('dark'); if (icon) icon.textContent = '☀️'; localStorage.setItem('theme', 'dark'); }
        else { html.classList.remove('dark'); if (icon) icon.textContent = '🌙'; localStorage.setItem('theme', 'light'); }
      }
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(saved === 'dark' || (!saved && prefersDark));
      if (toggle) toggle.addEventListener('click', () => setTheme(!html.classList.contains('dark')));
    })();
  </script>
</body>
</html>
